# Local PostgreSQL for development (`make db-up`). The credentials are for this
# machine only and match DATABASE_URL in backend/.env.example.
name: cati-forms

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cati
      POSTGRES_PASSWORD: cati
      POSTGRES_DB: cati_forms
    ports:
      # Only reachable from this machine.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cati -d cati_forms"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
