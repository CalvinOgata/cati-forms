# Runs the same make targets as a developer would, against a fresh PostgreSQL
# started by Docker Compose (compose.yaml), on every push to main and every PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Matches compose.yaml; the tests use cati_forms_test on the same server.
      DATABASE_URL: postgresql://cati:cati@localhost:5432/cati_forms
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies and generate Prisma Client
        run: make ci

      - name: Apply migrations and check none is missing
        run: make db-check

      - name: Type-check
        run: make check

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: End-to-end tests
        run: make test-e2e

      - name: Build
        run: make build
